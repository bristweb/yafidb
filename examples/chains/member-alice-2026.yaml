# Chain contribution/alice, year 2026. Each record is a YAML document, separated by ---.
# User fields are top-level. Yafi's own fields sit under yafi.
# A user who also signs adds a second entry to signatures.
---
type: cash
amount: 5000
note: |
  Initial investment, wired 2026-01-05.
yafi:
  schema: contribution@1
  seq: 1
  written_at: "2026-01-05T15:02:11Z"
  idem: req_7f3a            # idempotency key: a retry with the same key is ignored
  prev: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"  # all zeros: no previous record
  signatures:
    # Placeholders, not real signatures. The protected headers name kid worker-2026-a and alice-2026.
    - protected: "<base64url protected header>"
      signature: "<base64url signature>"
    - protected: "<base64url protected header>"
      signature: "<base64url signature>"
---
type: time
hours: 12
hourly_rate: 100
note: |
  Built the first prototype.
yafi:
  schema: contribution@1
  seq: 2
  written_at: "2026-01-09T20:41:55Z"
  idem: req_9b21
  prev: "<base64url SHA-256 of seq 1>"
  signatures:
    - protected: "<base64url protected header>"
      signature: "<base64url signature>"
