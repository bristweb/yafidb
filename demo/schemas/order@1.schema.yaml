$schema: https://json-schema.org/draft/2020-12/schema
title: Order
type: object
additionalProperties: false
required:
  - status
  - customer
  - items
properties:
  status:
    enum:
      - placed
      - shipped
      - delivered
      - cancelled
  customer:
    description: Reference to a customer record, /path.yaml#recordId
    type: string
    pattern: "^/customer/[A-Za-z0-9_@.-]+\\.yaml#[A-Za-z0-9_-]{22}(/.*)?$"
  items:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - sku
        - qty
        - price
      properties:
        sku:
          type: string
        qty:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
  note:
    type: string
  tracking:
    type: string
  carrierLog:
    type: string
