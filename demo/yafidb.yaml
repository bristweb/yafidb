# Deployment settings. Authority and pipelines live in the root manifest, root/yafi.yaml.
storage:
  type: local
  dir: root

schemas: schemas

keys:
  public: keys/public.jwks.json
  private: keys/private.jwk.json   # secret, never committed; YAFI_PRIVATE_JWK overrides

manifest:
  require_signature: false   # true: refuse an unsigned manifest (see `bun run sign-manifest`)
